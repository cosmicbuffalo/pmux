# >>> pmux auto mode >>>
# Auto mode (ai-auto answers agent permission prompts) is bound only when
# ai-auto is installed; run `pmux restart` after installing it.
if-shell "[ -x \"\$HOME/.local/bin/ai-auto\" ] || command -v \"\${AI_AUTO_BIN:-ai-auto}\" >/dev/null 2>&1" {
  bind-key -N "ai-auto: toggle auto mode for this process" "Tab" run-shell -b '"${AI_AUTO_BIN:-ai-auto}" toggle -t "#{pane_id}" -S "#{socket_path}" --message >/dev/null 2>&1 || tmux display-message "ai-auto failed (is it installed?)"'
  bind-key -N "ai-auto: inspect auto mode history for this process" "I" run-shell -b 'tmux display-popup -c #{q:client_name} -w 90% -h 90% -T " ai-auto history " -E "${AI_AUTO_BIN:-ai-auto} history -t \"#{pane_id}\" -S \"#{socket_path}\" --tui --client \"#{client_name}\""'
}
# <<< pmux auto mode <<<
