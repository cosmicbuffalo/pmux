# pmux managed status formats
#
# This file is generated by pmux and overwritten when generated configuration
# changes. Keep theme overrides in theme.conf and status customizations in
# tmux.conf. These formats deliberately avoid #() commands: tmux runs those
# once per attached client and they can overwhelm a long-lived pmux server.

# strftime's %s gives the current epoch without spawning date(1).
set-option -g @pmux_status_now "%s"

# Preserve custom session names. For generated names, show the executable from
# pmux's pane-local launch metadata, then fall back to tmux's command fields.
set-option -g @pmux_session_label_format "#{?#{||:#{m/r:^[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[[:alnum:]][[:alnum:]][[:alnum:]][[:alnum:]][[:alnum:]][[:alnum:]][[:alnum:]][[:alnum:]]$,#S},#{m/r:^.*-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]-[[:alnum:]][[:alnum:]][[:alnum:]][[:alnum:]]$,#S}},#{?@pmux_launch_command,#{b:#{s| .*||:@pmux_launch_command}},#{?pane_start_command,#{b:#{s| .*||:pane_start_command}},#{?pane_current_command,#{b:#{s| .*||:pane_current_command}},#S}}},#S}"

# Render compact session elapsed time with native arithmetic.
set-option -g @pmux_session_age_format "#{?#{e|<:#{e|-:#{T:@pmux_status_now},#{session_created}},60},#{e|-:#{T:@pmux_status_now},#{session_created}}s,#{?#{e|<:#{e|-:#{T:@pmux_status_now},#{session_created}},3600},#{e|/:#{e|-:#{T:@pmux_status_now},#{session_created}},60}m,#{?#{e|<:#{e|-:#{T:@pmux_status_now},#{session_created}},86400},#{e|/:#{e|-:#{T:@pmux_status_now},#{session_created}},3600}h,#{e|/:#{e|-:#{T:@pmux_status_now},#{session_created}},86400}d}}}"

# Render ai-attn colors, state text, age bucketing, and three-phase working
# animation. Invalid or future timestamps render as age zero.
set-option -g @pmux_ai_attn_format "#{?#{==:#{@ai_attn_pane_state},working},#[fg=#a6e3a1]working#{?#{==:#{e|%:#{T:@pmux_status_now},3},0},.,#{?#{==:#{e|%:#{T:@pmux_status_now},3},1},..,...}}#[default],#{?#{==:#{@ai_attn_pane_state},stopped},#[fg=#f38ba8]stopped#[default],#{?#{==:#{@ai_attn_pane_state},waiting},#[fg=#f9e2af]attn: ,#{?#{==:#{@ai_attn_pane_state},done},#[fg=#a6e3a1]done: ,#[fg=#f9e2af]#{@ai_attn_pane_state}: }}#{?#{e|<:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},60},#{e|*:#{e|/:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},10},10}s,#{?#{e|<:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},600},#{e|/:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},60}m,#{?#{e|<:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},3600},#{e|*:#{e|/:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},300},5}m,#{?#{e|<:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},86400},#{e|/:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},3600}h,#{e|/:#{?#{&&:#{e|>:#{@ai_attn_pane_updated_at},0},#{e|<=:#{@ai_attn_pane_updated_at},#{T:@pmux_status_now}}},#{e|-:#{T:@pmux_status_now},#{@ai_attn_pane_updated_at}},0},86400}d}}}} ago#[default]}}"

# ai-auto marks panes whose permission prompts are answered automatically.
set-option -g @pmux_ai_auto_format "#[fg=#1b1f2a,bg=#c6a0f6,bold] AUTO #[default]#{?@ai_auto_status, #[fg=#c6a0f6]#{=/40/…:@ai_auto_status}#[default],}"

# AUTO only while ai-auto's daemon is serving the pane (fresh heartbeat);
# a leftover @ai_auto=on after the daemon stopped shows as stopped instead.
set-option -g @pmux_ai_auto_state_format "#{?#{e|<:#{e|-:#{T:@pmux_status_now},#{?@ai_auto_heartbeat,#{@ai_auto_heartbeat},0}},30},#{T:@pmux_ai_auto_format},#[fg=#f38ba8#,bold]AUTO stopped#[default]}"

# The sidebar's label for this process: its user-chosen name, or for an
# auto-named process its agent's conversation title (italic), in the same
# rounded tag color. `pmux status-labels` publishes these options from tmux
# hooks; without a label the bracketed command chip below is shown instead.
# Reverse video draws the text in the status background on the tag color.
set-option -g @pmux_status_pill_format "#[default] #[fg=#{@pmux_status_pill}]#[reverse,bold]#{?@pmux_status_label_derived,#[italics],}#{@pmux_status_label}#[noreverse,nobold,noitalics]#[default] "

# Shown when a config from outside pmux changed this server (see the
# after-bind-key hook in tmux.conf's managed lifecycle block).
set-option -g @pmux_foreign_config_format "#[fg=#11111b,bg=#f38ba8,bold] tmux config changed: run pmux restart --repair #[default]"

# pmux's popups (the attach picker, key hints, rename, queue) get a rounded,
# muted border. Set these after status.conf is sourced to change them.
set-option -gw popup-border-lines "rounded"
set-option -gw popup-border-style "fg=#565f89"

set-option -g status-left "#{?@pmux_foreign_config,#{@pmux_foreign_config_format},}#{?#{&&:#{@pmux_status_label},#{@pmux_status_pill}},#{E:@pmux_status_pill_format},#{@pmux_process_chip_style} [#{T:@pmux_session_label_format}] }#{@pmux_age_style} #{T:@pmux_session_age_format} ago#{?@pmux_queue_status, #{@pmux_queue_status},}#{?#{==:#{@ai_auto},on}, #{T:@pmux_ai_auto_state_format},}#{?@ai_attn_pane_state, #{T:@pmux_ai_attn_format},} #[default]"
