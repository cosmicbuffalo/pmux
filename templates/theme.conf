# pmux theme configuration
#
# The installer or first pmux command creates ~/.config/pmux/theme.conf when it
# is missing. pmux never overwrites an existing copy. Edit it directly, then
# run `pmux restart` to apply changes. Delete it to recreate current defaults.
#
# Edit colors here to theme pmux statusline/hints.

# Base status bar style.
set-option -g @pmux_status_style "bg=#1b1f2a,fg=#c8d3f5"

# Left-side styles.
set-option -g @pmux_process_chip_style "#[fg=#8aadf4,bg=#2a3142,bold]"
set-option -g @pmux_age_style "#[fg=#9fb0d9,bg=#1b1f2a]"

# Prefix chip styles.
set-option -g @pmux_prefix_chip_on "#[fg=#1b1f2a,bg=#f6c177,bold] ^p #[default]"
set-option -g @pmux_prefix_chip_off "#[fg=#8aadf4,bg=#3a4258,bold] ^p #[default]"

# Hint chips (full and compact, active/inactive).
set-option -g @pmux_hints_full_on "#[fg=#7dcfff,bg=#2a3142] Switch (s) #[default] #[fg=#7dcfff,bg=#2a3142] Detach (d) #[default] #[fg=#7dcfff,bg=#2a3142] Keys (?) #[default]"
set-option -g @pmux_hints_compact_on "#[fg=#7dcfff,bg=#2a3142] Switch (s) #[default] #[fg=#7dcfff,bg=#2a3142] Detach (d) #[default] #[fg=#7dcfff,bg=#2a3142] Keys (?) #[default]"
set-option -g @pmux_hints_full_off ""
set-option -g @pmux_hints_compact_off ""
