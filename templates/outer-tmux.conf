# pmux integration for your outer tmux server
#
# The installer or first pmux command creates ~/.config/pmux/outer-tmux.conf
# when it is missing. pmux preserves your content; it only refreshes the
# clearly marked sidebar source block below. Edit it directly, then reload it
# with `tmux source-file -q ~/.config/pmux/outer-tmux.conf`.
#
# Add this line near the end of your outer tmux config:
#   source-file -q ~/.config/pmux/outer-tmux.conf
#
# The bundled sidebar is enabled by that same source-file line. It opens on
# the left by default with prefix + Ctrl-p. Set @pmux_sidebar_side to `right` after
# this file is sourced to change its side.
#
# The two window-status formats below provide a complete default experience.
# If you already have custom window tab styling, keep your formats and insert
# #{E:@ai_attn_window_segment} immediately before the window name instead.

# The guard lines keep this file from doing anything but warn if it is ever
# loaded into pmux's dedicated tmux server. Keep your settings between them.
# >>> pmux integration guard >>>
%if "#{==:#{@pmux_server},1}"
display-message -d 0 "This is pmux's integration for your own tmux (~/.config/pmux/outer-tmux.conf); it was not loaded into pmux's dedicated tmux server."
%else
# <<< pmux integration guard <<<

# >>> pmux managed sidebar >>>
# pmux's outer-tmux integration is generated by the binary itself (via
# `pmux tmux-init`) so it can never drift out of sync with your installed pmux.
# The apply line installs the sidebar toggle, its width/stability hooks, and the
# focus hook (relay host-pane tracking + sidebar refresh nudge); it re-runs on
# every config reload, so an updated pmux upgrades the integration in place.
# The first line removes tmux-ai-attn's retired terminal-bell fallback hooks,
# leaving any user-defined alert-bell handlers intact.
run-shell -b '~/.config/pmux/clear-legacy-ai-attn-bell-hook.sh "#{socket_path}"'
# The outer server never inherits pmux's environment, so this line names the
# binary that generated it and falls back to `pmux` on PATH if that moved.
run-shell -b 'pmux_bin="@PMUX_BIN@"; [ -x "$pmux_bin" ] || pmux_bin=pmux; "$pmux_bin" tmux-init --apply --socket "#{socket_path}" >/dev/null 2>&1 || true'
# <<< pmux managed sidebar <<<

# Match the maintained full setup: show all four agent states, keep newly seen
# attention visible long enough to notice, and use an approximately 1s flash.
set-option -g @ai_attn_enable_default_formats "off"
set-option -g @ai_attn_seen_flash_seconds "30"
set-option -g @ai_attn_flash_multiplier "8"
set-option -g @ai_attn_color_text_fg "colour255"

set-option -gw window-status-format "#[fg=colour244] #{window_index} #[fg=colour255]#{?#{==:#{@pmux_flash_window},on},#[fg=colour235#,bg=cyan]#{s|##\\[[^]]*\\]||:#{E:@ai_attn_window_segment}}#[fg=colour235#,bg=cyan],#{E:@ai_attn_window_segment}#{?#{?#{&&:#{@ai_attn_window_flash},#{@ai_attn_flash_phase}},0,1},#[fg=colour255],}}#W #[default]"
set-option -gw window-status-current-format "#[fg=colour16,bg=colour214,bold] #{window_index} #[fg=colour255,bg=colour238]#{?#{==:#{@pmux_flash_window},on},#[fg=colour235#,bg=cyan]#{s|##\\[[^]]*\\]||:#{E:@ai_attn_window_segment}}#[fg=colour235#,bg=cyan],#{E:@ai_attn_window_segment}#{?#{?#{&&:#{@ai_attn_window_flash},#{@ai_attn_flash_phase}},0,1},#[fg=colour255#,bg=colour238],}}#W #[default]"

# Reuse pmux's pinned tmux-ai-attn checkout on this outer tmux server.
# ai-attn-setup.sh also accepts @ai_attn_plugin_dir or
# PMUX_AI_ATTN_PLUGIN_DIR when you intentionally manage another checkout.
if-shell "[ -x \"\$HOME/.local/bin/ai-attn\" ] || command -v ai-attn >/dev/null 2>&1" {
  run-shell -b "~/.config/pmux/ai-attn-setup.sh"
}

# >>> pmux integration guard >>>
%endif
# <<< pmux integration guard <<<
