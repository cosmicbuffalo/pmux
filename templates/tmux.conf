# pmux tmux config
#
# The installer or first pmux command creates ~/.config/pmux/tmux.conf from
# this template when it is missing. pmux preserves edits to an existing file
# except for the marked lifecycle block below, which it replaces during a
# generated-config refresh. Edit outside that block, then run `pmux restart`.
#
# This file configures pmux's dedicated tmux server only. The guard lines
# below make it do nothing but show a warning if it is ever loaded into your
# own tmux. Keep your settings between them.
# >>> pmux server guard >>>
%if "#{!=:#{@pmux_server},1}"
display-message -d 0 "This is pmux's config (~/.config/pmux/tmux.conf); it only applies to pmux's dedicated tmux server, so it was not loaded here."
%else
# <<< pmux server guard <<<
source-file "~/.config/pmux/theme.conf"

set-option -g prefix "C-p"
unbind-key "C-b"
bind-key -N "pmux: send C-p to the program in this pane" "C-p" send-prefix
bind-key -N "process: detach" "d" detach-client
bind-key -N "process: kill this process and detach" "x" run-shell -b 'tmux display-popup -c #{q:client_name} -w 60 -h 9 -E "${PMUX_BIN:-pmux} prompt --title \"Kill this process?\" --confirm \"This ends the process and detaches.\" --action Kill --danger -- tmux kill-pane -t \"#{pane_id}\""'
bind-key -N "copy: copy mode (v select, y copy, q quit)" "[" copy-mode
set-option -g detach-on-destroy "on"
# >>> pmux managed lifecycle >>>
# pmux replaces this entire marked block during generated-config refreshes.
# Put custom lifecycle settings outside the markers so pmux preserves them.
# Keep the backend alive with zero sessions so the final session-closed hook runs.
set-option -s exit-empty "off"
# Keep the restore snapshot authoritative when a process exits on its own.
# Single quotes inside keep tmux's own $VAR expansion away from ${PMUX_BIN:-pmux}.
set-hook -g "session-closed[100]" "run-shell -b '\"\${PMUX_BIN:-pmux}\" snapshot >/dev/null 2>&1 || true'"
# Publish each process's sidebar label and tag color for the status bar
# (`pmux status-labels`). Colors depend on the whole process set and labels on
# names, so refresh when sessions come, go, or are renamed, and on every load.
# Also retry on attach and session switches: a title may have been unavailable
# at startup and agents do not necessarily change their pane title again.
# New sessions are caught by window-linked, not session-created: tmux-ai-attn
# rebuilds session-created from show-hooks output on every load, and that
# round trip drops any hook containing `$`.
set-hook -g "window-linked[101]" "run-shell -b '\"\${PMUX_BIN:-pmux}\" status-labels >/dev/null 2>&1 || true'"
set-hook -g "session-renamed[101]" "run-shell -b '\"\${PMUX_BIN:-pmux}\" status-labels >/dev/null 2>&1 || true'"
set-hook -g "session-closed[101]" "run-shell -b '\"\${PMUX_BIN:-pmux}\" status-labels >/dev/null 2>&1 || true'"
set-hook -g "client-attached[101]" "run-shell -b '\"\${PMUX_BIN:-pmux}\" status-labels >/dev/null 2>&1 || true'"
set-hook -g "client-session-changed[101]" "run-shell -b '\"\${PMUX_BIN:-pmux}\" status-labels >/dev/null 2>&1 || true'"
# Agents put their conversation title in the pane title, behind a status glyph
# that animates while they work: one token (`✳`, `⠋`) or a bracketed group
# (`[ ! ]`). Refresh only when the text after it changes, and give the agent a
# second to write the title to its transcript. @pmux_labels_pending keeps it
# to one refresh at a time, however fast a title changes.
set-hook -g 'pane-title-changed[101]' {
  if-shell -F '#{!=:#{s/^(\[[^]]*\]|[^ ]+) //:pane_title},#{@pmux_title_seen}}' {
    set-option -pF @pmux_title_seen '#{s/^(\[[^]]*\]|[^ ]+) //:pane_title}'
    if-shell -F '#{!=:#{@pmux_labels_pending},1}' {
      set-option -g @pmux_labels_pending 1
      run-shell -b 'sleep 1; tmux set-option -gu @pmux_labels_pending; "${PMUX_BIN:-pmux}" status-labels >/dev/null 2>&1 || true'
    }
  }
}
run-shell -b '"${PMUX_BIN:-pmux}" status-labels >/dev/null 2>&1 || true'
# Notice a tmux config meant for another server being loaded here, such as
# `tmux source-file ~/.tmux.conf` run in a pmux pane: it binds keys while
# server.conf's loading flag is unset. Flag it in the status bar and say how
# to undo it. `pmux restart --repair` clears the flag along with everything else.
set-hook -g 'after-bind-key[102]' {
  if-shell -F '#{!=:#{@pmux_loading_config},1}' {
    set -g @pmux_foreign_config 1
    display-message -d 8000 "pmux's tmux server just got key bindings from outside pmux's config. If a tmux config was loaded here by mistake, run: pmux restart --repair"
  }
}
set-hook -g 'after-unbind-key[102]' {
  if-shell -F '#{!=:#{@pmux_loading_config},1}' {
    set -g @pmux_foreign_config 1
  }
}
# <<< pmux managed lifecycle <<<
set-option -g mouse on
set-option -gw mode-keys "vi"
set-option -g status-keys "emacs"
set-option -s set-clipboard "on"
set-option -g status "on"
set-option -g status-position "bottom"
set-option -g status-interval 1
set-option -g status-style "#{@pmux_status_style}"
set-option -g status-left-length 120
set-option -g status-right-length 120
set-option -gw window-status-format ""
set-option -gw window-status-current-format ""
source-file "~/.config/pmux/status.conf"
set-option -g status-right "#{?client_prefix,#{@pmux_hints_full_on} #{@pmux_prefix_chip_on},#{@pmux_prefix_chip_off}}"

# pmux process navigation
bind-key -N "agents: queue messages to send later" "q" run-shell -b 'tmux display-popup -c #{q:client_name} -w 85% -h 85% -E "${PMUX_BIN:-pmux} queue-ui \"#{pane_id}\""'
# >>> pmux auto mode >>>
# Auto mode (ai-auto answers agent permission prompts) is bound only when
# ai-auto is installed; run `pmux restart` after installing it.
if-shell "[ -x \"\$HOME/.local/bin/ai-auto\" ] || command -v \"\${AI_AUTO_BIN:-ai-auto}\" >/dev/null 2>&1" {
  bind-key -N "ai-auto: toggle auto mode for this process" "Tab" run-shell -b '"${AI_AUTO_BIN:-ai-auto}" toggle -t "#{pane_id}" -S "#{socket_path}" --message >/dev/null 2>&1 || tmux display-message "ai-auto failed (is it installed?)"'
  bind-key -N "ai-auto: inspect auto mode history for this process" "I" run-shell -b 'tmux display-popup -c #{q:client_name} -w 90% -h 90% -T " ai-auto history " -E "${AI_AUTO_BIN:-ai-auto} history -t \"#{pane_id}\" -S \"#{socket_path}\" --tui --client \"#{client_name}\""'
}
# <<< pmux auto mode <<<
bind-key -N "process: new process running a command" "c" run-shell -b 'tmux display-popup -c #{q:client_name} -w 60 -h 9 -E "${PMUX_BIN:-pmux} prompt --title \"Command for a new process\" --action Run --split -- ~/.config/pmux/new-process.sh \"#{pane_id}\""'
bind-key -N "process: new process with a shell" "C" run-shell -b "~/.config/pmux/new-process.sh '#{pane_id}'"
bind-key -N "process: switch process, or resume a past session" "s" run-shell -b 'h=#{client_height}; [ "$h" -gt 1 ] && h=$((h-1)); tmux display-popup -c #{q:client_name} -x 0 -y 0 -w 100% -h "$h" -E "TMUX_PANE=#{pane_id} ${PMUX_BIN:-pmux} attach"'
bind-key -N "process: back to the last process in this pane" "l" run-shell -b '"${PMUX_BIN:-pmux}" last >/dev/null 2>&1 || true'
# `,` renames the process, as it renames the window in tmux. The rename form
# finds its own session, so no session name is ever spliced into shell
# text. `#{q:...}` below shell-escapes the values `k` must pass.
bind-key -N "process: rename this process" "," run-shell -b 'tmux display-popup -c #{q:client_name} -w 60 -h 9 -E "${PMUX_BIN:-pmux} rename-session-ui --pane \"#{pane_id}\""'
# `y` copies this process's name (what `pmux ls` and other pmux commands
# take) to the clipboard, e.g. to hand it to another agent session. The
# message also shows the agent title of an auto-named process.
# `pmux copy-to-clipboard` tries every route that can reach your
# clipboard: OSC 52 from pmux and from your own tmux, then a local tool
# (pbcopy, wl-copy, xclip, xsel, clip.exe) when you are not on SSH.
bind-key -N "process: copy this process's name to the clipboard" "y" run-shell -b '"${PMUX_BIN:-pmux}" copy-to-clipboard --client #{q:client_name} --session #{q:session_name} -- #{q:session_name} 2>/dev/null || tmux display-message -c #{q:client_name} "pmux: could not copy to the clipboard"' \; display-message "copied #{session_name}#{?@pmux_status_label_derived, (#{E:@pmux_status_label}),}"
bind-key -N "pmux: reload the pmux config" "r" source-file ~/.config/pmux/server.conf \; display-message "pmux config reloaded"
# n/p: cycle through processes by creation order (wrap-around).
# These use ambient pmux client state to stay easy to customize.
bind-key -N "process: next process" "n" run-shell -b '"${PMUX_BIN:-pmux}" next-process >/dev/null 2>&1 || true'
bind-key -N "process: previous process" "p" run-shell -b '"${PMUX_BIN:-pmux}" prev-process >/dev/null 2>&1 || true'
bind-key -N "process: kill this process, go to the next one" "k" run-shell -b '"${PMUX_BIN:-pmux}" kill-current-and-next #{q:session_name} #{q:client_tty} >/dev/null 2>&1 || true'
bind-key -N "ai-attn: clear this pane's attention signal" "a" run-shell -b 'ai-attn clear --pane >/dev/null 2>&1 || true'
# Key hints: pmux's own cheat sheet in place of tmux's full key list.
bind-key -N "pmux: show key hints" "?" run-shell -b '~/.config/pmux/help.sh --open "#{client_name}"'
bind-key -N "pmux: show key hints" "/" run-shell -b '~/.config/pmux/help.sh --open "#{client_name}"'
bind-key -N "pmux: show key hints" "h" run-shell -b '~/.config/pmux/help.sh --open "#{client_name}"'

# copy-mode bindings
bind-key -T "copy-mode-vi" "v" send-keys -X begin-selection
bind-key -T "copy-mode-vi" "C-v" send-keys -X rectangle-toggle
bind-key -T "copy-mode" "C-v" send-keys -X rectangle-toggle
bind-key -T "copy-mode-vi" "y" send-keys -X copy-selection-and-cancel

# ai-attn integration: load tmux-ai-attn plugin if ai-attn is installed.
# The native status clock drives pmux's one-second animation, so forcing every
# attached client to redraw on the plugin's faster spinner tick is unnecessary.
# State transitions still appear on the next status tick (at most one second).
set-option -g @ai_attn_refresh_client "off"
# Silently skipped when ai-attn is not available.
if-shell "[ -x \"\$HOME/.local/bin/ai-attn\" ] || command -v ai-attn >/dev/null 2>&1" {
  run-shell -b "~/.config/pmux/ai-attn-setup.sh"
}

# >>> pmux server guard >>>
%endif
# <<< pmux server guard <<<
