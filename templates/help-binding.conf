# Key hints: pmux's own cheat sheet in place of tmux's full key list.
bind-key -N "pmux: show key hints" "?" run-shell -b '~/.config/pmux/help.sh --open "#{client_name}"'
bind-key -N "pmux: show key hints" "/" run-shell -b '~/.config/pmux/help.sh --open "#{client_name}"'
bind-key -N "pmux: show key hints" "h" run-shell -b '~/.config/pmux/help.sh --open "#{client_name}"'
