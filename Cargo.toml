[package]
name = "pmux"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Process multiplexer for detachable CLI workflows on a dedicated tmux backend"
license = "Apache-2.0"
repository = "https://github.com/cosmicbuffalo/pmux"
homepage = "https://github.com/cosmicbuffalo/pmux"
keywords = ["tmux", "terminal", "multiplexer", "cli", "process-manager"]
categories = ["command-line-utilities"]
# The crate needs only its sources and the templates they embed; the scripts,
# tests and docs stay in the repository.
include = [
    "/build.rs",
    "/src/**",
    "/templates/**",
    "/tmux/**",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.28"
libc = "0.2"
notify = "7"
nucleo-matcher = "0.3"
rand = "0.9"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2"
tempfile = "3"
toml = "1"
unicode-width = "0.2"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
