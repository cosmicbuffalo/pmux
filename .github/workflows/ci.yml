name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        # Pinned: ubuntu-24.04 ships tmux 3.4, a version with its own quirks
        # (split -p, $ in options) that pmux must keep handling; the
        # tmux-versions job covers 3.3a and 3.8.
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v${version}"
      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Test release installer
        run: sh scripts/test-install.sh
      - name: End-to-end lifecycle and automation API smoke test
        run: sh scripts/test-lifecycle.sh
      - name: End-to-end outer tmux sidebar smoke test
        run: sh scripts/test-sidebar.sh
      - name: End-to-end cross-restart restore smoke test
        run: sh scripts/test-restore.sh
      - name: End-to-end scheduled message queue smoke test
        run: |
          cargo build
          python3 scripts/queue-smoke.py
      - name: Lint shell scripts (Linux)
        if: runner.os == 'Linux'
        run: |
          shellcheck install.sh uninstall.sh scripts/*.sh templates/*.sh
          shellcheck -s bash pmux.tmux
          shellcheck -e SC1091 -s bash templates/shell-integration.sh.in
      - name: Verify crates.io package (Linux)
        if: runner.os == 'Linux'
        run: cargo package

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check dependencies against the RustSec advisory database
        run: cargo audit

  tmux-versions:
    # The runners' own tmux is 3.4 (Ubuntu) and Homebrew's (macOS). Also cover
    # the documented minimum and the newest release, which changed formats
    # pmux reads (3.8 reports window layouts as JSON).
    strategy:
      fail-fast: false
      matrix:
        include:
          - tmux: "3.3a"
            sha256: e4fd347843bd0772c4f48d6dde625b0b109b7a380ff15db21e97c11a4dcdf93f
          - tmux: "3.8"
            sha256: e79c699c7e949dccd0a4a125e17b8d1261e311b16979dbc8eb34542f3966d82e
    name: tmux ${{ matrix.tmux }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build tmux ${{ matrix.tmux }}
        env:
          TMUX_VERSION: ${{ matrix.tmux }}
          TMUX_SHA256: ${{ matrix.sha256 }}
        run: |
          set -eu
          sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config
          curl -fsSL -o tmux.tar.gz "https://github.com/tmux/tmux/releases/download/$TMUX_VERSION/tmux-$TMUX_VERSION.tar.gz"
          echo "$TMUX_SHA256  tmux.tar.gz" | sha256sum -c -
          tar xzf tmux.tar.gz
          (cd "tmux-$TMUX_VERSION" && ./configure --prefix="$HOME/tmux" && make -j"$(nproc)" && make install)
          test "$("$HOME/tmux/bin/tmux" -V)" = "tmux $TMUX_VERSION"
      - name: Build pmux
        run: cargo build
      - name: Tests and end-to-end suites on tmux ${{ matrix.tmux }}
        run: |
          export PATH="$HOME/tmux/bin:$PATH"
          # Unit and integration tests drive real tmux servers too (menus,
          # format escaping, send), so they must pass on every version.
          cargo test --all-targets --all-features
          sh scripts/test-lifecycle.sh
          sh scripts/test-sidebar.sh
          sh scripts/test-restore.sh
          python3 scripts/queue-smoke.py

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: "1.88"
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: msrv-1.88
      - name: Test minimum supported Rust version
        run: cargo test --all-targets --all-features

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path target/lcov.info
      - name: Check coverage threshold
        run: cargo llvm-cov --all-features --workspace --summary-only --fail-under-lines 40

  build-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, msrv, audit, tmux-versions]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
            # Targets the runner executes natively get an install test of the
            # exact artifact being released.
            smoke: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            smoke: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Rename binary
        run: |
          cp target/${{ matrix.target }}/release/pmux pmux-${{ matrix.target }}
      - name: Install tmux for the artifact install test (Linux)
        if: matrix.smoke && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Install tmux for the artifact install test (macOS)
        if: matrix.smoke && runner.os == 'macOS'
        run: brew install tmux
      - name: Install, run, and uninstall the release artifact
        if: matrix.smoke
        run: PMUX_INSTALL_TEST_BINARY="$PWD/pmux-${{ matrix.target }}" sh scripts/test-install.sh
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pmux-${{ matrix.target }}
          path: pmux-${{ matrix.target }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name 'pmux-*' -exec cp {} ../ \;
          cd ..
          cp uninstall.sh pmux-uninstall.sh
          sha256sum pmux-* > checksums.txt
      - name: Attest build provenance
        # GitHub stores attestations only for public repositories (on a
        # personal account), so a dry-run release in a private copy skips
        # this step; on the public repository it always runs.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            pmux-*
            checksums.txt
      - name: Extract release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The section runs from this version's heading to the next one.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          body_path: release-notes.md
          # v0.1.0-rc.1 and friends must never become the release that
          # install.sh's releases/latest URL resolves to.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            pmux-*
            checksums.txt
