version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to the commit of its `stable` branch; its version tags name
      # Rust releases, not action releases.
      - dependency-name: dtolnay/rust-toolchain
